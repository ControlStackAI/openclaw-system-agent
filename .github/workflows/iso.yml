name: USB image and installed-system qualification
on:
  workflow_dispatch:
    inputs:
      case:
        description: Qualification case
        type: choice
        default: all
        options: [all, plasma, gnome, hyprland]
permissions:
  contents: read
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Prepare disposable VM runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect tesseract-ocr
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Build pinned USB image
        run: python3 scripts/image.py build --lock images/nixos.lock.json --output dist/image --jobs 2
      - name: Hyprland and Quickshell installation and disk boot
        if: inputs.case == 'all' || inputs.case == 'hyprland'
        run: /usr/bin/python3 scripts/qualify-iso.py dist/image/*.iso --mode uefi-install --desktop hyprland
      - name: Direct BIOS USB boot and offline gating
        if: inputs.case == 'all'
        run: /usr/bin/python3 scripts/qualify-iso.py dist/image/*.iso --mode bios-offline
      - name: UEFI USB installation and disk boot without USB
        if: inputs.case == 'all'
        run: /usr/bin/python3 scripts/qualify-iso.py dist/image/*.iso --mode uefi-install
      - name: Encrypted Plasma installation and disk boot
        if: inputs.case == 'all' || inputs.case == 'plasma'
        run: /usr/bin/python3 scripts/qualify-iso.py dist/image/*.iso --mode uefi-install --desktop plasma --encrypted --keyboard de
      - name: GNOME installation and disk boot
        if: inputs.case == 'all' || inputs.case == 'gnome'
        run: /usr/bin/python3 scripts/qualify-iso.py dist/image/*.iso --mode uefi-install --desktop gnome
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usb-qualification-evidence
          path: |
            .build/iso-test/**/*.log
            .build/iso-test/**/*.png
            .build/iso-test/**/result.json
      - name: Record the image qualification scope
        if: success()
        env:
          QUALIFICATION_CASE: ${{ inputs.case }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path("qualification-scope.json").write_text(json.dumps({
              "source_commit": os.environ["GITHUB_SHA"],
              "passed_case": os.environ["QUALIFICATION_CASE"],
              "real_account_login": False,
              "physical_hardware": False,
          }, indent=2) + "\n")
          PYTHON
      - name: Preserve the tested development ISO
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openclaw-nixos-development-iso
          path: |
            dist/image/*
            qualification-scope.json
          compression-level: 0
