name: Isolated VM qualification
on:
  workflow_dispatch:
    inputs:
      check:
        description: Test to run
        type: choice
        default: all
        options: [all, core-vm, lifecycle-vm, networking-vm]
permissions:
  contents: read
jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        check: ${{ fromJSON(inputs.check == 'all' && '["core-vm","lifecycle-vm","networking-vm"]' || format('["{0}"]', inputs.check)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Verify disposable runner KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Build and run guest-only checks
        env:
          CHECK_NAME: ${{ matrix.check }}
        run: |
          case "$CHECK_NAME" in core-vm|lifecycle-vm|networking-vm) ;; *) exit 2 ;; esac
          nix build ".#checks.x86_64-linux.$CHECK_NAME" --no-link --print-out-paths -L
