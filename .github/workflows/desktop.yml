name: Desktop interaction check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - run: nix build .#checks.x86_64-linux.desktop-vm.driver --out-link result-desktop-driver -L
      - name: Exercise the isolated desktop
        run: |
          mkdir -p .build/desktop/results
          cd .build/desktop
          ../../result-desktop-driver/bin/nixos-test-driver --output_directory results
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-qualification
          path: .build/desktop/results/*
