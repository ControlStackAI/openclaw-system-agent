# Owner-editable terminal defaults. Hyprland's separate configuration is Lua.
gtk-single-instance = false
font-family = JetBrainsMono Nerd Font
font-size = 12
adjust-cell-height = 8%
background = 0b1626
foreground = dce7f7
cursor-color = 88bdff
selection-background = 29435f
selection-foreground = ffffff
window-padding-x = 14
window-padding-y = 12
window-decoration = none
gtk-tabs-location = bottom
scrollback-limit = 10000000
# Nova's Ctrl+A leader shortcuts; Ctrl+A twice sends a literal Ctrl+A.
keybind = ctrl+a>shift+backslash=new_split:right
keybind = ctrl+a>minus=new_split:down
keybind = ctrl+a>h=goto_split:left
keybind = ctrl+a>j=goto_split:bottom
keybind = ctrl+a>k=goto_split:top
keybind = ctrl+a>l=goto_split:right
keybind = ctrl+a>z=toggle_split_zoom
keybind = ctrl+a>c=new_tab
keybind = ctrl+a>ctrl+a=text:\x01
